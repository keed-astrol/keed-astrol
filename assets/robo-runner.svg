<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="200" viewBox="0 0 800 200" shape-rendering="crispEdges" role="img" aria-label="Pixel robot running and jumping over electronic components">
  <style>
    .ground{animation:scroll .1422s linear infinite}
    @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-32px)}}
    .city{animation:city 24s linear infinite}
    @keyframes city{from{transform:translateX(0)}to{transform:translateX(-800px)}}

    .jump{animation:jump 4s infinite}
    @keyframes jump{
      0%,62%{transform:translateY(0);animation-timing-function:cubic-bezier(.2,.8,.4,1)}
      72%{transform:translateY(-70px);animation-timing-function:cubic-bezier(.6,0,.8,.2)}
      82%,100%{transform:translateY(0)}
    }
    .shadow{transform-box:fill-box;transform-origin:center;animation:shadow 4s infinite}
    @keyframes shadow{
      0%,62%{transform:scaleX(1);opacity:.4;animation-timing-function:cubic-bezier(.2,.8,.4,1)}
      72%{transform:scaleX(.4);opacity:.12;animation-timing-function:cubic-bezier(.6,0,.8,.2)}
      82%,100%{transform:scaleX(1);opacity:.4}
    }

    .legA{animation:legA .3s linear infinite}
    .legB{animation:legB .3s linear infinite}
    @keyframes legA{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes legB{0%,49%{opacity:0}50%,100%{opacity:1}}

    .blink{animation:blink 1s steps(1) infinite}
    @keyframes blink{0%{fill:#ff5555}50%{fill:#f1fa8c}}
    .eyes{animation:eyes 3s infinite}
    @keyframes eyes{0%,92%{opacity:1}93%,97%{opacity:0}98%,100%{opacity:1}}
    .pulse{animation:pulse 1.2s ease-in-out infinite alternate}
    @keyframes pulse{from{opacity:1}to{opacity:.35}}

    .dust{animation:dust .45s linear infinite}
    @keyframes dust{from{transform:translate(0,0);opacity:.8}to{transform:translate(-26px,-6px);opacity:0}}

    .obs{animation:obs 8s linear infinite}
    .obsB,.obsB .bolt{animation-delay:-4s}
    @keyframes obs{0%{transform:translateX(800px)}50%,100%{transform:translateX(-100px)}}
    .bolt{animation:bolt 8s linear infinite}
    @keyframes bolt{0%,34.5%{opacity:1}34.6%,100%{opacity:0}}
    .bob{animation:bob .6s ease-in-out infinite alternate}
    @keyframes bob{from{transform:translateY(0)}to{transform:translateY(-4px)}}

    .pop{animation:pop 4s infinite}
    @keyframes pop{
      0%,69%{opacity:0;transform:translateY(0)}
      70%{opacity:1;transform:translateY(0)}
      90%{opacity:0;transform:translateY(-18px)}
      100%{opacity:0}
    }

    .n{opacity:0;animation:cnt 32s linear infinite}
    @keyframes cnt{0%,12.49%{opacity:1}12.5%,100%{opacity:0}}

    .tw{animation:tw 2.2s ease-in-out infinite alternate}
    @keyframes tw{from{opacity:1}to{opacity:.15}}
    .win{animation:win 5s steps(1) infinite}
    @keyframes win{0%{opacity:.7}60%{opacity:.15}}

    text{font-family:'Courier New',Consolas,monospace;font-weight:700}

    @media (prefers-reduced-motion: reduce){
      *{animation:none !important}
      .obsA{transform:translateX(330px)}
      .obsB{transform:translateX(560px)}
      .n0{opacity:1}
    }
  </style>

  <defs>
    <clipPath id="frame"><rect width="800" height="200" rx="12"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14151f"/>
      <stop offset="1" stop-color="#2b2d3c"/>
    </linearGradient>
    <pattern id="pcb" width="32" height="40" patternUnits="userSpaceOnUse">
      <rect width="32" height="40" fill="#1c1d27"/>
      <rect width="32" height="4" fill="#50fa7b"/>
      <rect y="4" width="32" height="4" fill="#2e8b57"/>
      <rect y="18" width="20" height="2" fill="#a07a12"/>
      <rect x="20" y="18" width="2" height="12" fill="#a07a12"/>
      <rect x="18" y="28" width="6" height="6" fill="#ffd700"/>
      <rect x="4" y="30" width="2" height="8" fill="#a07a12"/>
      <rect x="2" y="12" width="6" height="6" fill="#ffd700"/>
    </pattern>
    <g id="skyline" fill="#343746">
      <rect x="0" y="110" width="60" height="50"/>
      <rect x="70" y="80" width="40" height="80"/>
      <rect x="120" y="120" width="70" height="40"/>
      <rect x="200" y="65" width="30" height="95"/>
      <rect x="213" y="50" width="4" height="15"/>
      <rect x="240" y="100" width="80" height="60"/>
      <rect x="330" y="90" width="50" height="70"/>
      <rect x="390" y="125" width="90" height="35"/>
      <rect x="490" y="75" width="40" height="85"/>
      <rect x="540" y="105" width="70" height="55"/>
      <rect x="620" y="85" width="45" height="75"/>
      <rect x="675" y="115" width="85" height="45"/>
      <rect x="765" y="95" width="35" height="65"/>
      <g fill="#f1fa8c">
        <rect class="win" x="10" y="120" width="6" height="6" opacity=".6"/>
        <rect x="30" y="134" width="6" height="6" opacity=".5"/>
        <rect x="80" y="92" width="6" height="6" opacity=".6"/>
        <rect class="win" x="94" y="110" width="6" height="6" opacity=".6" style="animation-delay:-2s"/>
        <rect x="80" y="128" width="6" height="6" opacity=".4"/>
        <rect x="208" y="78" width="6" height="6" opacity=".6"/>
        <rect class="win" x="208" y="104" width="6" height="6" opacity=".6" style="animation-delay:-3.5s"/>
        <rect x="256" y="112" width="6" height="6" opacity=".5"/>
        <rect x="290" y="126" width="6" height="6" opacity=".6"/>
        <rect class="win" x="344" y="102" width="6" height="6" opacity=".6" style="animation-delay:-1s"/>
        <rect x="360" y="124" width="6" height="6" opacity=".4"/>
        <rect x="420" y="136" width="6" height="6" opacity=".5"/>
        <rect x="500" y="88" width="6" height="6" opacity=".6"/>
        <rect class="win" x="514" y="118" width="6" height="6" opacity=".6" style="animation-delay:-4s"/>
        <rect x="556" y="116" width="6" height="6" opacity=".5"/>
        <rect x="632" y="98" width="6" height="6" opacity=".6"/>
        <rect class="win" x="648" y="124" width="6" height="6" opacity=".6" style="animation-delay:-2.7s"/>
        <rect x="700" y="128" width="6" height="6" opacity=".5"/>
        <rect x="776" y="108" width="6" height="6" opacity=".6"/>
      </g>
    </g>
    <!-- collectible volt bolt, local coords inside an obstacle group -->
    <g id="volt" fill="#f1fa8c">
      <rect x="20" y="34" width="8" height="4"/>
      <rect x="16" y="38" width="8" height="4"/>
      <rect x="12" y="42" width="16" height="4"/>
      <rect x="16" y="46" width="8" height="4"/>
      <rect x="12" y="50" width="8" height="4"/>
    </g>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="800" height="200" fill="url(#sky)"/>

    <!-- stars -->
    <g fill="#f8f8f2">
      <rect class="tw" x="40" y="22" width="2" height="2"/>
      <rect class="tw" x="132" y="48" width="2" height="2" style="animation-delay:-.7s"/>
      <rect class="tw" x="250" y="18" width="2" height="2" style="animation-delay:-1.4s"/>
      <rect class="tw" x="318" y="56" width="2" height="2" style="animation-delay:-.3s"/>
      <rect class="tw" x="402" y="30" width="2" height="2" style="animation-delay:-1.9s"/>
      <rect class="tw" x="470" y="62" width="2" height="2" style="animation-delay:-1.1s"/>
      <rect class="tw" x="560" y="24" width="2" height="2" style="animation-delay:-.5s"/>
      <rect class="tw" x="612" y="58" width="2" height="2" style="animation-delay:-1.6s"/>
      <rect class="tw" x="736" y="70" width="2" height="2" style="animation-delay:-.9s"/>
    </g>

    <!-- ringed planet -->
    <g shape-rendering="auto">
      <circle cx="690" cy="52" r="12" fill="#ffb86c"/>
      <circle cx="686" cy="48" r="3" fill="#ffd59e" opacity=".7"/>
      <ellipse cx="690" cy="53" rx="22" ry="5" fill="none" stroke="#ff79c6" stroke-width="2" opacity=".8"/>
    </g>

    <!-- HUD -->
    <text x="18" y="26" font-size="13" fill="#bd93f9">ROBO//RUN</text>
    <text x="18" y="42" font-size="10" fill="#6272a4">player: keed-astro</text>
    <g font-size="13" fill="#f1fa8c">
      <text x="702" y="26" text-anchor="end">VOLTS</text>
      <text class="n n0" x="742" y="26" text-anchor="end" style="animation-delay:-33.12s">000</text>
      <text class="n" x="742" y="26" text-anchor="end" style="animation-delay:-29.12s">001</text>
      <text class="n" x="742" y="26" text-anchor="end" style="animation-delay:-25.12s">002</text>
      <text class="n" x="742" y="26" text-anchor="end" style="animation-delay:-21.12s">003</text>
      <text class="n" x="742" y="26" text-anchor="end" style="animation-delay:-17.12s">004</text>
      <text class="n" x="742" y="26" text-anchor="end" style="animation-delay:-13.12s">005</text>
      <text class="n" x="742" y="26" text-anchor="end" style="animation-delay:-9.12s">006</text>
      <text class="n" x="742" y="26" text-anchor="end" style="animation-delay:-5.12s">007</text>
    </g>
    <g transform="translate(750,12)" fill="#f1fa8c">
      <rect x="6" y="0" width="4" height="3"/>
      <rect x="4" y="3" width="4" height="3"/>
      <rect x="2" y="6" width="8" height="3"/>
      <rect x="4" y="9" width="4" height="3"/>
      <rect x="2" y="12" width="4" height="3"/>
    </g>

    <!-- parallax skyline -->
    <g class="city">
      <use href="#skyline" xlink:href="#skyline"/>
      <use href="#skyline" xlink:href="#skyline" x="800"/>
    </g>

    <!-- circuit-board ground -->
    <g class="ground"><rect x="0" y="160" width="864" height="40" fill="url(#pcb)"/></g>

    <!-- obstacle A: electrolytic capacitor -->
    <g class="obs obsA">
      <rect x="6" y="152" width="3" height="8" fill="#c0c0c0"/>
      <rect x="15" y="152" width="3" height="8" fill="#c0c0c0"/>
      <rect x="0" y="124" width="24" height="28" fill="#3b6fd8"/>
      <rect x="0" y="124" width="24" height="4" fill="#9ab3f5"/>
      <rect x="16" y="128" width="4" height="24" fill="#dfe7ff"/>
      <rect x="0" y="148" width="24" height="4" fill="#2a52a8"/>
      <g class="bolt"><g class="bob"><use href="#volt" xlink:href="#volt"/></g></g>
    </g>

    <!-- obstacle B: IC chip -->
    <g class="obs obsB">
      <g fill="#c0c0c0">
        <rect x="2" y="150" width="4" height="10"/>
        <rect x="10" y="150" width="4" height="10"/>
        <rect x="18" y="150" width="4" height="10"/>
        <rect x="26" y="150" width="4" height="10"/>
      </g>
      <rect x="0" y="130" width="32" height="22" fill="#23242e"/>
      <rect x="0" y="130" width="32" height="3" fill="#44475a"/>
      <rect x="13" y="130" width="6" height="3" fill="#14151f"/>
      <rect x="4" y="136" width="3" height="3" fill="#8be9fd"/>
      <rect x="10" y="143" width="16" height="2" fill="#6272a4"/>
      <g class="bolt"><g class="bob"><use href="#volt" xlink:href="#volt"/></g></g>
    </g>

    <!-- shadow -->
    <ellipse class="shadow" cx="170" cy="161" rx="18" ry="3" fill="#000" shape-rendering="auto"/>

    <!-- running dust -->
    <rect class="dust" x="152" y="154" width="4" height="4" fill="#6272a4"/>
    <rect class="dust" x="148" y="156" width="3" height="3" fill="#6272a4" style="animation-delay:-.22s"/>

    <!-- robot -->
    <g transform="translate(150,108)">
      <g class="jump">
        <rect class="blink" x="16" y="0" width="8" height="4" fill="#ff5555"/>
        <rect x="18" y="4" width="4" height="4" fill="#6272a4"/>
        <rect x="4" y="8" width="32" height="16" fill="#bd93f9"/>
        <rect x="4" y="8" width="32" height="4" fill="#d6bcfa"/>
        <rect x="8" y="12" width="24" height="8" fill="#282a36"/>
        <rect x="12" y="16" width="16" height="2" fill="#8be9fd" opacity=".5"/>
        <g class="eyes" fill="#8be9fd">
          <rect x="12" y="12" width="4" height="8"/>
          <rect x="24" y="12" width="4" height="8"/>
        </g>
        <rect x="12" y="24" width="16" height="4" fill="#6272a4"/>
        <rect x="8" y="28" width="24" height="16" fill="#bd93f9"/>
        <rect x="8" y="40" width="24" height="4" fill="#9b6fe0"/>
        <rect class="pulse" x="16" y="32" width="8" height="4" fill="#ff79c6"/>
        <g fill="#6272a4">
          <rect x="0" y="28" width="8" height="4"/>
          <rect x="0" y="32" width="4" height="8"/>
          <rect x="32" y="28" width="8" height="4"/>
          <rect x="36" y="32" width="4" height="8"/>
        </g>
        <g class="legA" fill="#6272a4">
          <rect x="12" y="44" width="4" height="4"/>
          <rect x="8" y="48" width="4" height="4"/>
          <rect x="24" y="44" width="4" height="4"/>
          <rect x="28" y="48" width="4" height="4"/>
        </g>
        <g class="legB" fill="#6272a4">
          <rect x="12" y="44" width="4" height="8"/>
          <rect x="24" y="44" width="4" height="8"/>
        </g>
      </g>
    </g>

    <!-- +1 popup on collect -->
    <text class="pop" x="196" y="46" font-size="12" fill="#f1fa8c">+1 VOLT</text>
  </g>
</svg>
