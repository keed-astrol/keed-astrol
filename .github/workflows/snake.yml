name: Generate snake animation

on:
  schedule:
    - cron: "17 * * * *"     # refresh every hour from your live contribution data
  workflow_dispatch:         # lets you run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Draw the multi-year snake
        env:
          # Uses a personal token if you add one as a secret named SNAKE_TOKEN,
          # otherwise the built-in token.
          GITHUB_TOKEN: ${{ secrets.SNAKE_TOKEN || secrets.GITHUB_TOKEN }}
        # Shows the current year and the two before it (2024, 2025, 2026 right now).
        # To pin specific years instead, add e.g.:  --years 2024 2025 2026
        run: python3 .github/scripts/snake_years.py --user ${{ github.repository_owner }} --out dist

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
